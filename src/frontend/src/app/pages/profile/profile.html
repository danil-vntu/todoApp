<div class="space-y-6">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">
            Welcome to your profile!
        </h1>

        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400">
            Here you can find some settings and information.
        </p>
    </div>

    <div class="grid gap-4 lg:grid-cols-2">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                Information
            </h2>

            <div class="mt-4 divide-y divide-slate-100 dark:divide-slate-800">
                <p class="flex flex-col gap-1 py-3 text-sm sm:flex-row sm:items-center sm:justify-between">
                    <span class="text-slate-500 dark:text-slate-400">
                    Name
                    </span>

                    <span class="font-medium text-slate-950 dark:text-white">
                    {{ name() }}
                    </span>
                </p>

                <p class="flex flex-col gap-1 py-3 text-sm sm:flex-row sm:items-center sm:justify-between">
                    <span class="text-slate-500 dark:text-slate-400">
                        Email
                    </span>

                    <span class="font-medium text-slate-950 dark:text-white">
                        {{ email() }}
                    </span>
                </p>

                <p class="flex flex-col gap-1 py-3 text-sm sm:flex-row sm:items-center sm:justify-between">
                    <span class="text-slate-500 dark:text-slate-400">
                        Account created
                    </span>

                    <span class="font-medium text-slate-950 dark:text-white">
                        {{ createdAt() | date:'dd.MM.yyyy HH:mm' }}
                    </span>
                </p>
            </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                Settings
            </h2>

            <div class="mt-4 rounded-xl border border-slate-200 p-4 dark:border-slate-800">
                <p class="text-sm font-medium text-slate-700 dark:text-slate-300">
                    Change name
                </p>

                <div class="mt-3 flex flex-col gap-3 sm:flex-row">
                    <input
                    type="text"
                    placeholder="{{ name() }}"
                    class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white dark:placeholder:text-slate-500"
                    [(ngModel)]="newName"
                    />

                    <button
                    class="rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 sm:whitespace-nowrap"
                    (click)="updateUser()"
                    >
                        Change name
                    </button>
                </div>
            </div>

            <div class="mt-4 grid gap-3 sm:grid-cols-2">
                <a routerLink="/change-password" class="rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium text-slate-700 transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700 dark:border-slate-800 dark:text-slate-300 dark:hover:border-blue-900 dark:hover:bg-blue-950/40 dark:hover:text-blue-300">
                    Change password
                </a>

                <a routerLink="/delete-account" class="rounded-xl border border-red-200 px-4 py-3 text-sm font-medium text-red-700 transition hover:bg-red-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950/40">
                    Delete account
                </a>
            </div>
        </div>
    </div>
</div>
