    <div>
        <div class="border rounded flex flex-col gap-3 p-4">
            <h1 class="text-2xl font-bold">
                Wellcome to your profile!
            </h1>

            <p>
                Here you can find some settings and information.
            </p>
        </div>

        <div class="border rounded p-4 flex gap-3 w-full mt-4">
            <div class="border rounded p-4 w-full">
                information

                <p>
                Name: {{ name() }}
                </p>

                <p>
                    Email: {{ email() }}
                </p>

                <p>
                    Account created: {{ createdAt() | date:'dd.MM.yyyy HH:mm' }}
                </p>
            </div>

            <div class="border rounded p-4 w-full">
                settings

                <div class="border rounded flex gap-3 p-4 w-full">
                    <p class="w-full">
                        Change name:
                    </p>

                    <input 
                    type="text"
                    placeholder="{{ name() }}"
                    class="border rounded w-full"
                    [(ngModel)]="newName"
                    />

                    <button
                    class="border rounded w-full"
                    (click)="updateUser()"
                    >
                        Change name
                    </button>
                </div>

                <p>
                    <a routerLink="/change-password" class="text-blue-600">
                        Change password.
                    </a>
                </p>
            </div>
            
        </div>
    </div>
