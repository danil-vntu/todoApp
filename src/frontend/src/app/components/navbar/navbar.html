<nav
  class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur sm:px-6 dark:border-slate-800 dark:bg-slate-950/95"
>
  @if (isAuthenticated()) {
    <div
      class="mx-auto flex w-full max-w-6xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="flex items-center gap-3">
        <a
          routerLink="/tasks"
          class="text-lg font-semibold tracking-tight text-slate-950 dark:text-white"
        >
          NorthTodo
        </a>

        <button
          class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          title="Toggle theme"
        >
          @if (isDark()) {
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          } @else {
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.99 12.79A9 9 0 1 1 11.21 3.01 7 7 0 0 0 20.99 12.79z"></path>
            </svg>
          }
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <a
          routerLink="/tasks"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white"
        >
          Tasks
        </a>

        <a
          routerLink="/categories"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white"
        >
          Categories
        </a>

        <a
          routerLink="/profile"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white"
        >
          Profile
        </a>

        <button
          class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-300 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-900"
          (click)="requestLogout()"
        >
          Log out
        </button>
      </div>
    </div>
  } @else {
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a
          routerLink="/login"
          class="text-lg font-semibold tracking-tight text-slate-950 dark:text-white"
        >
          NorthTodo
        </a>

        <button
          class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          title="Toggle theme"
        >
          @if (isDark()) {
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          } @else {
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.99 12.79A9 9 0 1 1 11.21 3.01 7 7 0 0 0 20.99 12.79z"></path>
            </svg>
          }
        </button>
      </div>

      <div class="flex items-center gap-2">
        <a
          routerLink="/login"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white"
        >
          Login
        </a>

        <a
          routerLink="/register"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white"
        >
          Register
        </a>
      </div>
    </div>
  }
</nav>

@if (isLogoutConfirmationOpen) {
  <div
    class="fixed inset-0 z-50 flex items-start justify-center bg-slate-950/40 px-4 py-20"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-800 dark:bg-slate-900"
    >
      <h2 class="text-base font-semibold text-slate-950 dark:text-white">Log out?</h2>

      <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400">
        You will need to sign in again to manage your tasks.
      </p>

      <div class="mt-5 flex justify-end gap-2">
        <button
          class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
          (click)="cancelLogout()"
        >
          Cancel
        </button>

        <button
          class="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700"
          (click)="confirmLogout()"
        >
          Log out
        </button>
      </div>
    </div>
  </div>
}
